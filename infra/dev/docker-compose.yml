services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: zyara-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: zyara_dev
      POSTGRES_PASSWORD: zyara_dev_only
      POSTGRES_DB: zyara_dev
    ports:
      - "5433:5432"
    volumes:
      - zyara-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zyara_dev -d zyara_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  zyara-pgdata:
