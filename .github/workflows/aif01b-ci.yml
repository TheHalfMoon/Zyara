name: aif01b-ci
on:
  push:
    branches:
      - "feat/zyara-network-aif01b-capability-resolver"
  pull_request:
    paths:
      - "packages/capability-gateway/**"
      - "packages/collaboration/**"
      - "packages/authorization/**"
      - "packages/adapter-harness/**"
      - "db/migrations/046_capability_registry.sql"
      - "apps/api/scripts/aif01b-capability-rls-smoke.mjs"
      - "tests/aif01b/**"
      - "docs/evidence/AIF/**"
      - ".github/workflows/aif01b-ci.yml"

jobs:
  capability-resolver:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zyara_dev
          POSTGRES_PASSWORD: zyara_dev_only
          POSTGRES_DB: zyara_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U zyara_dev"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: postgresql://zyara_dev:zyara_dev_only@localhost:5432/zyara_dev
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @zyara/capability-gateway typecheck
      - run: pnpm --filter @zyara/aif01b-tests test
      - run: pnpm --filter @zyara/aif01a-tests test
      - run: pnpm --filter @zyara/capability-gateway lint
      - run: pnpm --filter @zyara/aif01b-tests lint
      - run: node scripts/check-boundaries.mjs
      - run: pnpm --filter @zyara/api exec node scripts/aif01b-capability-rls-smoke.mjs
