name: m016-ci
on:
  pull_request:
    paths:
      - "packages/scheduling/**"
      - "packages/contracts/**"
      - "apps/api/src/bookings*"
      - "apps/api/src/index.ts"
      - "apps/api/scripts/m016*"
      - "tests/m016/**"
      - "db/migrations/016_booking_operations.sql"
      - ".github/workflows/m016-ci.yml"
  push:
    branches: [main]
    paths:
      - "packages/scheduling/**"
      - "packages/contracts/**"
      - "apps/api/src/bookings*"
      - "apps/api/src/index.ts"
      - "apps/api/scripts/m016*"
      - "tests/m016/**"
      - "db/migrations/016_booking_operations.sql"
jobs:
  m016:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zyara_dev
          POSTGRES_PASSWORD: zyara_dev_only
          POSTGRES_DB: zyara_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U zyara_dev"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: postgresql://zyara_dev:zyara_dev_only@localhost:5432/zyara_dev
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @zyara/scheduling typecheck
      - run: pnpm --filter @zyara/scheduling lint
      - run: pnpm --filter @zyara/contracts typecheck
      - run: pnpm --filter @zyara/api typecheck
      - run: pnpm --filter @zyara/m016-tests test
      - run: pnpm --filter @zyara/api exec node scripts/m016-booking-smoke.mjs
