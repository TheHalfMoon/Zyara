name: m007-ci
on:
  pull_request:
    paths:
      - "packages/graph-import/**"
      - "tests/graph-import/**"
      - ".github/workflows/m007-ci.yml"
  push:
    branches: [main]
    paths:
      - "packages/graph-import/**"
      - "tests/graph-import/**"
jobs:
  m007:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @zyara/graph-import typecheck
      - run: pnpm --filter @zyara/graph-import lint
      - run: pnpm --filter @zyara/graph-import-tests test
