name: m002-ci
on:
  pull_request:
    paths:
      - "packages/identity/**"
      - "packages/authorization/**"
      - "apps/api/**"
      - "db/migrations/002*"
      - "tests/m002/**"
      - ".github/workflows/m002-ci.yml"
  push:
    branches: [main]
    paths:
      - "packages/identity/**"
      - "packages/authorization/**"
      - "apps/api/**"
      - "db/migrations/002*"
      - "tests/m002/**"
jobs:
  m002:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zyara_dev
          POSTGRES_PASSWORD: zyara_dev_only
          POSTGRES_DB: zyara_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U zyara_dev"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: postgresql://zyara_dev:zyara_dev_only@localhost:5432/zyara_dev
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @zyara/identity typecheck
      - run: pnpm --filter @zyara/authorization typecheck
      - run: pnpm --filter @zyara/api typecheck
      - run: pnpm --filter @zyara/m002-tests test
      - run: node scripts/m002-rls-smoke.mjs
