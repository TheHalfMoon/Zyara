name: n5c4-ci
on:
  push:
    branches:
      - "feat/zyara-network-n5c4-audit-chain"
  pull_request:
    paths:
      - "packages/collaboration/**"
      - "packages/enterprise-access/**"
      - "packages/communication/**"
      - "apps/api/**"
      - "db/migrations/045_audit_chain.sql"
      - "tests/n5c4/**"
      - "docs/evidence/N5/**"
      - ".github/workflows/n5c4-ci.yml"

jobs:
  audit-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zyara_dev
          POSTGRES_PASSWORD: zyara_dev_only
          POSTGRES_DB: zyara_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U zyara_dev"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: postgresql://zyara_dev:zyara_dev_only@localhost:5432/zyara_dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @zyara/collaboration typecheck
      - run: pnpm --filter @zyara/enterprise-access typecheck
      - run: pnpm --filter @zyara/communication typecheck
      - run: pnpm --filter @zyara/api typecheck
      - run: pnpm --filter @zyara/n5c4-tests test
      - run: pnpm --filter @zyara/collaboration lint
      - run: pnpm --filter @zyara/enterprise-access lint
      - run: pnpm --filter @zyara/communication lint
      - run: pnpm --filter @zyara/api lint
      - run: pnpm --filter @zyara/n5c4-tests lint
      - run: node scripts/check-boundaries.mjs
      - run: pnpm --filter @zyara/api exec node scripts/n5c4-audit-chain-rls-smoke.mjs
      - run: pnpm --filter @zyara/api exec tsx scripts/n5c4-audit-chain-http-smoke.ts
