name: aif02a-ci
on:
  push:
    branches:
      - "feat/zyara-network-aif02a-privacy-egress"
  pull_request:
    paths:
      - "packages/privacy-egress/**"
      - "packages/capability-gateway/**"
      - "packages/consent-boundaries/**"
      - "tests/aif02a/**"
      - "docs/evidence/AIF/AIF-02A/**"
      - ".github/workflows/aif02a-ci.yml"

jobs:
  privacy-egress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @zyara/privacy-egress typecheck
      - run: pnpm --filter @zyara/capability-gateway typecheck
      - run: pnpm --filter @zyara/aif02a-tests test
      - run: pnpm --filter @zyara/aif01a-tests test
      - run: pnpm --filter @zyara/privacy-egress lint
      - run: pnpm --filter @zyara/aif02a-tests lint
      - run: node scripts/check-boundaries.mjs
