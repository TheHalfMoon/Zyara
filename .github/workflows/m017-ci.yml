name: m017-ci
on:
  pull_request:
    paths:
      - "packages/patient/**"
      - "tests/m017/**"
      - "apps/web/app/[locale]/book/**"
      - ".github/workflows/m017-ci.yml"
  push:
    branches: [main]
    paths:
      - "packages/patient/**"
      - "tests/m017/**"
      - "apps/web/app/[locale]/book/**"
      - ".github/workflows/m017-ci.yml"
jobs:
  m017:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @zyara/patient typecheck
      - run: pnpm --filter @zyara/patient lint
      - run: pnpm --filter @zyara/m017-tests test
      - run: pnpm --filter @zyara/web typecheck
