name: aif01a-ci
on:
  push:
    branches:
      - "feat/zyara-network-aif01a-capability-contract"
  pull_request:
    paths:
      - "packages/capability-gateway/**"
      - "packages/collaboration/**"
      - "packages/consent-boundaries/**"
      - "tests/aif01a/**"
      - "docs/evidence/AIF/**"
      - ".github/workflows/aif01a-ci.yml"

jobs:
  capability-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @zyara/capability-gateway typecheck
      - run: pnpm --filter @zyara/collaboration typecheck
      - run: pnpm --filter @zyara/aif01a-tests test
      - run: pnpm --filter @zyara/n5c1-tests test
      - run: pnpm --filter @zyara/capability-gateway lint
      - run: pnpm --filter @zyara/aif01a-tests lint
      - run: node scripts/check-boundaries.mjs
