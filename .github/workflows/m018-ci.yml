name: m018-ci
on:
  pull_request:
    paths:
      - "packages/scheduling/src/changes.ts"
      - "packages/scheduling/src/change-explanations.ts"
      - "packages/scheduling/src/index.ts"
      - "tests/m018/**"
      - "apps/web/app/[locale]/book/change/**"
      - ".github/workflows/m018-ci.yml"
  push:
    branches: [main]
    paths:
      - "packages/scheduling/src/changes.ts"
      - "packages/scheduling/src/change-explanations.ts"
      - "packages/scheduling/src/index.ts"
      - "tests/m018/**"
      - "apps/web/app/[locale]/book/change/**"
      - ".github/workflows/m018-ci.yml"
jobs:
  m018:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @zyara/scheduling typecheck
      - run: pnpm --filter @zyara/scheduling lint
      - run: pnpm --filter @zyara/m018-tests test
      - run: pnpm --filter @zyara/web typecheck
