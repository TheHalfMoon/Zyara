name: m006-ci
on:
  pull_request:
    paths:
      - "packages/graph/**"
      - "db/migrations/006*"
      - "tests/graph/**"
      - ".github/workflows/m006-ci.yml"
  push:
    branches: [main]
    paths:
      - "packages/graph/**"
      - "db/migrations/006*"
      - "tests/graph/**"
jobs:
  m006:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zyara_dev
          POSTGRES_PASSWORD: zyara_dev_only
          POSTGRES_DB: zyara_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U zyara_dev"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: postgresql://zyara_dev:zyara_dev_only@localhost:5432/zyara_dev
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @zyara/graph typecheck
      - run: pnpm --filter @zyara/graph-tests test
      - run: pnpm --filter @zyara/api exec node scripts/m006-graph-smoke.mjs
