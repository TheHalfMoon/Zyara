name: c1-ci
on:
  push:
    branches:
      - "feat/zyara-network-c1-agent-identities"
  pull_request:
    paths:
      - "packages/agent-authority/**"
      - "apps/api/**"
      - "db/migrations/042_agent_identities.sql"
      - "tests/m056/**"
      - "docs/evidence/C1/**"
      - ".github/workflows/c1-ci.yml"

jobs:
  agent-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zyara_dev
          POSTGRES_PASSWORD: zyara_dev_only
          POSTGRES_DB: zyara_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U zyara_dev"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: postgresql://zyara_dev:zyara_dev_only@localhost:5432/zyara_dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @zyara/agent-authority typecheck
      - run: pnpm --filter @zyara/api typecheck
      - run: pnpm --filter @zyara/m056-tests test
      - run: pnpm --filter @zyara/agent-authority lint
      - run: pnpm --filter @zyara/api lint
      - run: pnpm --filter @zyara/m056-tests lint
      - run: node scripts/check-boundaries.mjs
      - run: pnpm --filter @zyara/api exec tsx scripts/c1-agent-http-smoke.ts
      - run: pnpm --filter @zyara/api exec node scripts/c1-agent-rls-smoke.mjs
